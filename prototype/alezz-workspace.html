  acq: ['الاستقطاب', 'ملف واحد لكل مؤثر', ['بحث وتصفية بالحالة والمرشِّح ونوع الحساب', 'جدول المؤثرين مع السعر قبل وبعد التفاوض', 'ملف المؤثر: الترشيح، اعتماد متعب، التواصل والتفاوض، الحملات'], ['جدول أوضح بأعمدة ثابتة وشارات حالة', 'ملف المؤثر كلوحة جانبية بدل نافذة فوق الصفحة']],
  camps: ['الحملات', 'المطلوب والحصص والتقدم', ['بطاقة لكل حملة بأرقامها الثمانية', 'جدول الحصص لكل موظف وتوزيعها', 'إعدادات الحملة وزر الترشيح الجماعي'], ['تقدم الحملة كشريط واحد واضح', 'جدول الحصص قابل للتعديل بنفس شكل باقي الجداول']],
  pipe: ['خط الإنتاج', 'المراحل الست ومين مسؤول', ['لوحة المراحل بعدد المفتوح والمتأخر', 'بحث وتصفية بالصانع والحملة والمتأخر', 'جدول الملفات ويفتح ملف المشاركة'], ['المراحل كمسار أفقي يقرأ من اليمين', 'المتأخر مميّز بشارة مو بلون السطر فقط']],
  req: ['الطلبات', 'بديل الواتساب بين الأدوار', ['قائمة الطلبات مع غير المقروء', 'سجل كل طلب مثل المحادثة', 'تسليم، مراجعة، إرجاع للتعديل، إشعارات المتصفح'], ['فصل «عليّ» عن «طلبته من غيري» بتبويبين', 'السجل الزمني بخط أوضح وأسماء بارزة']],
  today: ['تقرير اليوم', 'دقيقتين آخر الدوام', ['اللي انسجّل تلقائياً من شغل اليوم', 'قائمة المهام اليومية حسب الدور', 'شغل غير مسجّل ومعوّقات تحتاج تدخّل'], ['المعوّقات في خانة بارزة لأنها أهم ما في التقرير', 'حالة الحفظ واضحة جنب الزر']],
  setup: ['الإعدادات', 'الفريق والمدد والقوائم', ['تفعيل الأعضاء وتحديد الأدوار', 'المدة المسموحة لكل مرحلة', 'قوائم تقرير اليوم، إعدادات بطاقة الأداء، مفاتيح البنك'], ['تقسيم الصفحة لأقسام بقائمة جانبية داخلية', 'تأكيد قبل أي تغيير في الأدوار']]
};

const S = { view: 'mine', who: 'metab', rows: {}, filter: 'all', q: '', mode: 'data', closed: {} };
let uid = 0; for (const k in SEED) S.rows[k] = SEED[k].map(r => ({ id: ++uid, q: r[0], n: r[1], m: r[2], p: r[3], age: r[4], sla: r[5] }));
const late = r => r.age > r.sla, soon = r => r.age === r.sla;
const days = n => n === 1 ? 'يوم' : n === 2 ? 'يومين' : n <= 10 ? n + ' أيام' : n + ' يوم';
const mine = () => S.rows[S.who];
let toastT; function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 3200); }

function nav() {
  const n = mine().length;
  const link = ([k, t]) => `<a href="#${k}" ${S.view === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[k]}"/></svg>${t}${k === 'mine' && n ? `<span class="n num" aria-label="${n} مهمة">${n}</span>` : ''}</a>`;
  $('nav1').innerHTML = NAV.map(link).join(''); $('nav2').innerHTML = NAV2.map(link).join('');
  $('meName').textContent = PEOPLE[S.who][0]; $('meRole').textContent = PEOPLE[S.who][1]; $('meAv').textContent = PEOPLE[S.who][0][0];
}
function ageBadge(r) { return `<span class="b ${late(r) ? 'danger' : soon(r) ? 'warn' : ''}">${late(r) ? `متأخر ${days(r.age - r.sla)}` : soon(r) ? 'آخر يوم في المدة' : r.age ? `${days(r.age)} من ${r.sla}` : 'اليوم'}</span>`; }
function rowHtml(r, bulk, withQueue) {
  const q = Q[r.q];
  return `<div class="row" data-id="${r.id}">${bulk ? `<input type="checkbox" id="c${r.id}" aria-label="تحديد ${esc(r.n)}">` : '<span></span>'}
    <div><div class="t">${esc(r.n)}</div><div class="m">${esc([withQueue ? q.t : '', r.m, r.p].filter(Boolean).join(' · '))}</div></div>
    <div class="st">${ageBadge(r)}</div>
    <div class="a">${q.acts.map(([a, l]) => `<button class="btn ${a === 'no' ? 'no' : a === 'open' ? '' : 'quiet'}" data-act="${a}" type="button">${l}</button>`).join('')}</div></div>`;
}
function pageMine() {
  const all = mine(), nLate = all.filter(late).length, nSoon = all.filter(soon).length;
  $('pTitle').textContent = 'مهامي'; $('pSub').textContent = all.length ? `${all.length} شي ينتظر خطوة منك، منها ${nLate} متأخر` : 'ما عندك شي معلّق';
  $('pActs').innerHTML = `<label class="field" for="who">اعرض مهام<select id="who">${Object.entries(PEOPLE).map(([k, v]) => `<option value="${k}" ${k === S.who ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label><button class="btn lg quiet" data-help type="button">كيف يمشي الشغل؟</button><button class="btn lg" data-new="طلب" type="button">+ طلب</button><button class="btn lg primary" data-new="ترشيح" type="button">+ ترشيح</button>`;
  const demo = `<div class="demo">نموذج عرض ببيانات تجريبية، مو مربوط بالنظام. جرّب الأزرار براحتك.<span class="seg" role="group" aria-label="حالة الصفحة">${[['data', 'بيانات'], ['load', 'تحميل'], ['empty', 'فاضي'], ['err', 'خطأ']].map(([k, t]) => `<button type="button" data-mode="${k}" aria-pressed="${S.mode === k}">${t}</button>`).join('')}</span></div>`;
  if (S.mode === 'load') return $('page').innerHTML = demo + `<div class="kpis">${'<div class="kpi static"><div class="sk" style="width:50%"></div><div class="sk" style="width:30%;height:28px;margin-top:8px"></div></div>'.repeat(4)}</div><div class="group">${'<div class="row"><span></span><div style="display:grid;gap:8px"><div class="sk" style="width:40%"></div><div class="sk" style="width:70%"></div></div></div>'.repeat(5)}</div>`;
  if (S.mode === 'err') return $('page').innerHTML = demo + `<div class="state"><h2>ما قدرنا نحمّل مهامك</h2><p>فيه مشكلة في الاتصال بالإنترنت. تأكد من النت، وبياناتك محفوظة ما راح منها شي.</p><button class="btn primary" data-mode="data" type="button">حاول مرة ثانية</button></div>`;
  if (S.mode === 'empty' || !all.length) return $('page').innerHTML = demo + `<div class="state"><h2>ما عندك شي معلّق الحين</h2><p>أي ترشيح أو طلب يحتاج خطوة منك يطلع هنا مباشرة. تقدر تبدأ ترشيح جديد أو تطلب شي من زميل.</p><div class="acts"><button class="btn primary" data-new="ترشيح" type="button">+ ترشيح</button> <button class="btn" data-new="طلب" type="button">+ طلب</button></div></div>`;
  const fl = S.filter, qq = S.q.trim();
  const L = all.filter(r => (fl === 'all' || (fl === 'late' ? late(r) : fl === 'soon' ? soon(r) : Q[r.q].f === fl)) && (!qq || (r.n + r.m).includes(qq)));
  const kinds = [['all', 'الكل'], ['late', 'المتأخر'], ['appr', 'اعتماد'], ['video', 'مقاطع'], ['ship', 'شحن وعناوين'], ['req', 'طلبات']].filter(([k]) => k === 'all' || k === 'late' || all.some(r => Q[r.q].f === k));
  const kpi = (k, l, v, h, cls) => `<button class="kpi ${cls || ''}" type="button" data-f="${k}" aria-pressed="${fl === k}"><span class="l">${l}</span><span class="v num">${v}</span><span class="h">${h}</span></button>`;
  const startList = L.filter(late).sort((a, b) => (b.age - b.sla) - (a.age - a.sla)).slice(0, 3);
  const groups = Object.keys(Q).filter(k => L.some(r => r.q === k)).map(k => { const q = Q[k], R = L.filter(r => r.q === k).sort((a, b) => (b.age - b.sla) - (a.age - a.sla)), nl = R.filter(late).length, shut = S.closed[k];
    return `<section class="group" data-g="${k}"><div class="ghead"><button class="btn quiet" data-fold="${k}" type="button" aria-expanded="${!shut}" aria-label="${shut ? 'افتح' : 'اطوِ'} ${q.t}">${shut ? '◂' : '▾'}</button><h2>${q.t}</h2><span class="c num">${R.length}</span>${nl ? `<span class="b danger">${nl} متأخر</span>` : ''}
      <div class="tools">${(q.sheet || []).map(x => `<button class="btn" data-sheet type="button">${x}</button>`).join('')}${q.bulk && !shut ? `<label for="all_${k}"><input type="checkbox" id="all_${k}" data-all> الكل</label><button class="btn ok" data-bulk="${q.bulk}" type="button">${q.bulk} للمحدد</button>` : ''}</div></div>${shut ? '' : R.map(r => rowHtml(r, !!q.bulk)).join('')}</section>`; }).join('');
  $('page').innerHTML = demo + `<div class="kpis">${kpi('all', 'ينتظر خطوة منك', all.length, 'في كل القوائم')}${kpi('late', 'متأخر', nLate, 'تجاوز المدة المسموحة', nLate ? 'danger' : '')}${kpi('soon', 'آخر يوم في المدة', nSoon, 'يتأخر بكرة لو ما تحرك', nSoon ? 'warn' : '')}<div class="kpi static"><span class="l">أقدم شي عندك</span><span class="v num">${days(Math.max(...all.map(r => r.age)))}</span><span class="h">${esc(all.slice().sort((a, b) => b.age - a.age)[0].n)}</span></div></div>
   <div class="filters" role="group" aria-label="تصفية المهام">${kinds.map(([k, t]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${fl === k}">${t}</button>`).join('')}<input type="search" id="q" placeholder="ابحث باسم المؤثر أو الحملة" value="${esc(S.q)}" aria-label="بحث في المهام"></div>
   ${startList.length && fl === 'all' && !qq ? `<section class="group start"><div class="ghead"><h2>ابدأ من هنا</h2><span class="m" style="color:var(--muted);font-size:12px">الأكثر تأخيراً أول</span></div>${startList.map(r => rowHtml(r, false, true)).join('')}</section>` : ''}
   ${groups || '<div class="state"><h2>ما فيه نتائج بهذي التصفية</h2><p>غيّر التصفية أو امسح البحث عشان ترجع كل مهامك.</p><button class="btn" data-f="all" type="button">اعرض الكل</button></div>'}`;
}
function pageDash() {
  $('pTitle').textContent = 'لوحة الأداء'; $('pSub').textContent = 'نوفمبر 2026 · من 1 إلى 12 نوفمبر'; $('pActs').innerHTML = '<button class="btn lg" data-sheet type="button">تنزيل Excel</button>';
  const K = [['استقطاب جديد', '14', 'هذا الشهر'], ['تم الاتفاق', '6', 'من 14 استقطاب'], ['وفّرنا بالتفاوض', '4,300', 'ريال'], ['نزل على منصة', '9', 'مقطع'], ['متأخر الحين', '5', 'في كل المراحل', 'danger']];
  const lv = [['منخفض', 'danger'], ['دون المتوسط', 'danger'], ['متوسط', 'warn'], ['جيد', 'warn'], ['جيد جداً', 'ok'], ['مثالي', 'ok']];
  const C = [['ريم', 44.5, 74, [5, 4, 6, 6]], ['متعب', 41.8, 70, [4, 5, 5, 4]], ['خالد', 37.3, 62, [3, 3, 5, 6]], ['صقر', 37.0, 62, [3, 4, 4, 5]]];
  $('page').innerHTML = `<div class="demo">نموذج عرض ببيانات تجريبية. يوضح شكل البطاقات والجداول والشارات، وباقي أقسام اللوحة تتصمم في المرحلة 2.</div>
   <div class="kpis">${K.map(([l, v, h, c]) => `<div class="kpi static ${c || ''}"><span class="l">${l}</span><span class="v num">${v}</span><span class="h">${h}</span></div>`).join('')}</div>
   <section class="sec"><h2>بطاقة الأداء الشهرية</h2><div class="tw"><table><thead><tr><th>الصانع</th><th class="n">الدرجة من 60</th><th class="n">النسبة</th><th>المقاطع</th><th>الإشغال</th><th>نسبة الإنجاز</th><th>سرعة النشر</th></tr></thead><tbody>${C.map(([n, s, p, L]) => `<tr><td><b>${n}</b></td><td class="n">${s}</td><td class="n"><span class="b ${p >= 75 ? 'ok' : p >= 65 ? 'warn' : 'danger'}">${p}٪</span></td>${L.map(x => `<td><span class="b ${lv[x - 1][1]}">${lv[x - 1][0]}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
   <section class="sec"><h2>معوّقات تحتاج تدخّلك</h2><div class="group"><div class="row"><span></span><div><div class="t">شحنة متأخرة عند شركة الشحن من 4 أيام</div><div class="m">ريم · 10 نوفمبر</div></div><span class="b danger st">يومين بدون رد</span><div class="a"><button class="btn" data-new="طلب" type="button">حوّله لطلب</button></div></div><div class="row"><span></span><div><div class="t">ما عندي صلاحية الرد على تعليقات Spark</div><div class="m">لؤي · 11 نوفمبر</div></div><span class="b st">جديد</span><div class="a"><button class="btn" data-new="طلب" type="button">حوّله لطلب</button></div></div></div></section>`;
}
function pageAudit(k) {
  const [t, sub, now, next] = AUDIT[k]; $('pTitle').textContent = t; $('pSub').textContent = sub; $('pActs').innerHTML = '';
  $('page').innerHTML = `<div class="demo">هذي الصفحة ما تصممت في المرحلة 1. تحت جرد اللي فيها اليوم، وكله يبقى كما هو.</div><div class="cols"><div class="card"><h3>وش فيها اليوم</h3><ul>${now.map(x => `<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>المقترح في المرحلة 2</h3><ul>${next.map(x => `<li>${x}</li>`).join('')}</ul></div></div>`;
}
function render() { nav(); if (S.view === 'mine') pageMine(); else if (S.view === 'dash') pageDash(); else pageAudit(S.view); }
function route() { const v = location.hash.slice(1); S.view = [...NAV, ...NAV2].some(x => x[0] === v) ? v : 'mine'; $('side').classList.remove('open'); $('shade').hidden = true; closeSheet(); render(); window.scrollTo(0, 0); }
function closeSheet() { $('sheet').hidden = true; }
function openSheet(r) { const q = Q[r.q];
  $('sheet').innerHTML = `<div style="display:flex;gap:12px;align-items:start"><div style="flex:1;min-width:0"><h2 style="font-size:18px">${esc(r.n)}</h2><div class="m" style="color:var(--muted);font-size:13px">${esc(r.m)}</div></div><button class="btn" id="sx" type="button">إغلاق</button></div>
   <div>${ageBadge(r)} ${r.p ? `<span class="b">${esc(r.p)}</span>` : ''}</div>
   <div><h3 style="font-size:13px;color:var(--muted);margin-bottom:8px">وين وصل الملف</h3><ol class="steps">${STEPS.map((s, i) => `<li class="${i < q.step ? 'd' : i === q.step ? 'c' : ''}">${s}${i === q.step ? ' (الحين)' : ''}</li>`).join('')}</ol></div>
   <p style="color:var(--muted);font-size:13px">في النسخة الفعلية تنفتح هنا كل أقسام الملف الستة بنفس حقولها وأزرارها الحالية.</p>`;
  $('sheet').hidden = false; $('sx').onclick = closeSheet; $('sx').focus();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#menu')) { $('side').classList.add('open'); $('shade').hidden = false; return; }
  if (t.id === 'shade') { $('side').classList.remove('open'); $('shade').hidden = true; return; }
  if (t.id === 'out') return toast('في النسخة الفعلية: تسجيل الخروج');
  const md = t.closest('[data-mode]'); if (md) { S.mode = md.dataset.mode; return render(); }
  const f = t.closest('[data-f]'); if (f) { S.filter = f.dataset.f; S.q = ''; return render(); }
  const fold = t.closest('[data-fold]'); if (fold) { S.closed[fold.dataset.fold] = !S.closed[fold.dataset.fold]; return render(); }
  const nw = t.closest('[data-new]'); if (nw) return toast(`في النسخة الفعلية: تنفتح نافذة «${nw.dataset.new} جديد» بنفس حقولها الحالية`);
  if (t.closest('[data-help]')) return toast('في النسخة الفعلية: ينفتح دليل الشغل حسب دورك');
  if (t.closest('[data-sheet]')) return toast('في النسخة الفعلية: ينزل ملف Excel على جهازك');
  const all = t.closest('[data-all]'); if (all) { all.closest('.group').querySelectorAll('.row input[type=checkbox]').forEach(c => c.checked = all.checked); return; }
  const bulk = t.closest('[data-bulk]'); if (bulk) { const ids = [...bulk.closest('.group').querySelectorAll('.row input:checked')].map(c => +c.closest('.row').dataset.id); if (!ids.length) return toast('حدّد ملف واحد على الأقل'); S.rows[S.who] = mine().filter(r => !ids.includes(r.id)); render(); return toast(`${bulk.dataset.bulk}: ${ids.length} ملف (نموذج عرض، ما تغيّر شي في النظام)`); }
  const a = t.closest('[data-act]'); if (a) { const r = mine().find(x => x.id === +a.closest('.row').dataset.id); if (!r) return;
    if (a.dataset.act === 'open') return openSheet(r);
    if (a.dataset.act === 'acct') return toast('في النسخة الفعلية: يفتح حساب المؤثر في تبويب جديد');
    return toast(a.dataset.act === 'no' ? 'في النسخة الفعلية: يطلب سبب الرفض ثم يحفظ' : 'في النسخة الفعلية: يطلب وش المطلوب تعديله ثم يرجّعه لصاحبه'); }
});
document.addEventListener('change', e => { if (e.target.id === 'who') { S.who = e.target.value; S.filter = 'all'; S.q = ''; S.mode = 'data'; render(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const p = e.target.selectionStart; pageMine(); const q = $('q'); if (q) { q.focus(); q.setSelectionRange(p, p); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); $('side').classList.remove('open'); $('shade').hidden = true; } });
window.addEventListener('hashchange', route); route();
</script>
